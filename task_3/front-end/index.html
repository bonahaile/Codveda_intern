<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST API Dashboard</title>
    <link rel="stylesheet" href="style.css">
   
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <header class="header">
            <h1>API Dashboard</h1>
            <p>Fetching and displaying data dynamically from your REST API.</p>
            <button id="fetch-btn" class="btn">Refresh Data</button>
        </header>

        <div id="loading" class="loading hidden">data from API...</div>

        <div id="error-msg" class="error hidden"></div>

        <main>
            <section id="data-container" class="grid-container">
               
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
